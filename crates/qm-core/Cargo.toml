[package]
name = "qm-core"
description = "QuickMath backend: projects, note storage and exporters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qm-format.workspace = true
typst-assets.workspace = true
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
unicode-math-class = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Pure-Rust Hunspell-compatible spell checker (from the Helix editor), so
# any Hunspell dictionary adds a language and no C library is needed.
spellbook = "0.4.2"
# Pure-Rust PDF renderer for slide decks. Already built as part of typst;
# the default features add the standard PDF fonts, so no system fonts are needed.
hayro = "0.7.1"

[dev-dependencies]
tempfile = "3"
