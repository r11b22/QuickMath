[package]
name = "qm-format"
description = "The QuickMath (.qm) note format: parser, syntax tree and LaTeX conversion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Reads src/math/syntax.toml at build time (see build.rs). Already in the
# workspace lockfile through typst; `preserve_order` keeps file order, which
# decides the LaTeX of typed Unicode symbols.
[build-dependencies]
toml = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
toml = { workspace = true, features = ["preserve_order"] }
