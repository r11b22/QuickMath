QQ = ["ℚ", '\mathbb{Q}']
CC = ["ℂ", '\mathbb{C}']
forall = ["∀", '\forall']
exists = ["∃", '\exists']
nexists = ["∄", '\nexists']
not = ["¬", '\neg']
