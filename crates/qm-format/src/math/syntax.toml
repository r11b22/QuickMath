# The QuickMath math vocabulary: every word (`alpha`, `sum`, `sqrt`, …) and
# operator spelling (`<=`, `->`, …) the parser knows, with its Unicode and
# LaTeX forms.
#
# This file is compiled into the program: `build.rs` checks it and turns it
# into Rust tables, so a mistake here fails the build with a message naming
# the entry. To add syntax, add a line to the right section and rebuild; see
# `integral2` in [integral] for an example. Every renderer and exporter
# (preview, PDF, LaTeX, Obsidian) picks it up, and the editor's Notation panel
# lists it under Symbols, grouped by section.
#
# Spellings
#   - A word is ASCII letters, optionally followed by digits (`integral2`).
#     Digits after a word that is not defined here stay a subscript, so `x2`
#     is still x₂. Every word also works in backslash form: `\alpha`.
#   - An operator is ASCII punctuation such as `<=`; it may end in letters
#     (`!in`), in which case it only matches when no letter follows. Operators
#     may only appear in the letter, symbol, relation, binary and punctuation
#     sections. An operator cannot start with ( ) [ ] { } _ ^ ' " ` or \, and
#     a lone `/` is the fraction slash.
#   - Each spelling may be defined once in the whole file.
#   - Use literal strings ('\alpha') for LaTeX so backslashes need no escaping.
#
# Order matters in one place: a Unicode character typed directly (`≤`) gets
# the LaTeX of the first entry with that text, operators before words.
#
# Symbol sections: `spelling = ["Unicode text", 'LaTeX']`
#   [letter]          italic, like single-letter variables (lowercase Greek)
#   [symbol]          upright ordinary symbols
#   [relation]        spaced like `=`; ends a run and is a row's alignment point
#   [binary]          spaced like `+`
#   [punctuation]     spaced like `,`; ends a run
#   [large-operator]  scripts above and below in display math; takes spoken
#                     limits (`sum i=1 to n`, `lim x to 0`)
#   [integral]        large, scripts to the side; takes spoken limits
#   [function]        upright names like `sin`, spaced from their argument;
#                     scripts to the side and no spoken limits
#
# Structure sections (words only):
#   [structure]  `word = "sqrt" | "root" | "over"`
#   [fence]      `word = ["open", "close"]`, delimiters around the argument
#   [accent]     `word = "hat" | "bar" | "vector" | "dot" | "double-dot" | "tilde"`
#   [font]       `word = "calligraphic" | "bold" | "blackboard"`
#   [matrix]     `word = ["open", "close"]`; an empty close ("") means none
#   [space]      `word = { width = "thin" | "medium" | "thick" | "quad", count = n }`
#   [postfix]    `word = ["text", 'LaTeX']`, a superscript on the previous term
#   [prose]      `word = "shown text"`, upright prose that ends a run
#
# Kept in code because they are grammar rather than vocabulary: `inf`
# directly followed by `_` means the infimum, `^*` is the conjugate star, and
# `'` is a prime.

[letter]
alpha = ["α", '\alpha']
beta = ["β", '\beta']
gamma = ["γ", '\gamma']
delta = ["δ", '\delta']
eps = ["ε", '\varepsilon']
epsilon = ["ε", '\varepsilon']
varepsilon = ["ε", '\varepsilon']
zeta = ["ζ", '\zeta']
eta = ["η", '\eta']
theta = ["θ", '\theta']
vartheta = ["ϑ", '\vartheta']
iota = ["ι", '\iota']
kappa = ["κ", '\kappa']
lambda = ["λ", '\lambda']
lamda = ["λ", '\lambda']
mu = ["μ", '\mu']
nu = ["ν", '\nu']
xi = ["ξ", '\xi']
pi = ["π", '\pi']
varpi = ["ϖ", '\varpi']
rho = ["ρ", '\rho']
varrho = ["ϱ", '\varrho']
sigma = ["σ", '\sigma']
varsigma = ["ς", '\varsigma']
tau = ["τ", '\tau']
upsilon = ["υ", '\upsilon']
phi = ["φ", '\varphi']
varphi = ["φ", '\varphi']
chi = ["χ", '\chi']
psi = ["ψ", '\psi']
omega = ["ω", '\omega']

