"/=" = ["≠", '\neq']
":=" = ["≔", ":="]
"<<" = ["≪", '\ll']
">>" = ["≫", '\gg']
"=" = ["=", "="]
"<" = ["<", "<"]
">" = [">", ">"]
"~" = ["∼", '\sim']
in = ["∈", '\in']
notin = ["∉", '\notin']
sub = ["⊂", '\subset']
